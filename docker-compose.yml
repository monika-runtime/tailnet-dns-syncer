version: "3.8"

services:
  syncer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tailnet-dns-syncer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=UTC
    volumes:
      # Mount nginx config dir so the syncer can write proxy configs
      - nginx-confd:/etc/nginx/conf.d:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "from pathlib import Path; exit(0 if Path('/var/run/tailnet-dns-syncer.pid').exists() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Optional nginx reverse proxy ──────────────────────────────
  # Enable by setting NGINX_PROXY_ENABLED=true in .env (requires
  # DEVICE_FILTER_TAG and NGINX_PUBLIC_IP to also be set).
  # The syncer writes per-device .conf files into the shared volume
  # and reloads nginx whenever the config changes.
  nginx:
    image: nginx:alpine
    container_name: tailnet-nginx-proxy
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx-confd:/etc/nginx/conf.d:ro
    depends_on:
      - syncer

volumes:
  nginx-confd:
